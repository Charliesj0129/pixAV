# Managed deployment entry. Start only the profiles accepted for the current phase.
# Application profiles are added after their deployment contracts are verified.
name: ${PIXAV_MANAGED_PROJECT:?set the dedicated managed project}
x-app: &app
  image: ${PIXAV_MANAGED_APP_IMAGE:-pixav-managed-unconfigured:refused}
  pull_policy: never
  restart: "no"
  user: ${PIXAV_MANAGED_UID:-1000}:${PIXAV_MANAGED_GID:-1000}
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 1.0
  mem_limit: 768m
  memswap_limit: 768m
  pids_limit: 256
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
x-db-environment: &db-environment
  PIXAV_DB_HOST: postgres
  PIXAV_DB_PORT: "5432"
  PIXAV_DB_NAME: ${PIXAV_MANAGED_DATABASE:-pixav_managed}
  PIXAV_EXPECTED_DB_IDENTITY: ${PIXAV_EXPECTED_DB_IDENTITY:-UNBOUND}
  PIXAV_EXPECTED_DB_NAME: ${PIXAV_MANAGED_DATABASE:-pixav_managed}
  PIXAV_EXPECTED_REDIS_DATABASE: ${PIXAV_EXPECTED_REDIS_DATABASE:-0}
  PIXAV_SETTINGS_SECRETS_DIR: /run/secrets
x-private-transport: &private-transport
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: "*"
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  no_proxy: "*"
x-gateway: &gateway
  image: ${PIXAV_MANAGED_GATEWAY_IMAGE:-pixav-gateway-unconfigured:refused}
  pull_policy: never
  restart: "no"
  user: ${PIXAV_MANAGED_UID:-1000}:${PIXAV_MANAGED_GID:-1000}
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  cpus: 0.25
  mem_limit: 128m
  memswap_limit: 128m
  pids_limit: 64
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    - /etc/nginx/conf.d:rw,nosuid,nodev,noexec,size=1m,mode=0700,uid=${PIXAV_MANAGED_UID:-1000},gid=${PIXAV_MANAGED_GID:-1000}
x-activity-environment: &activity-environment
  <<: *db-environment
  PIXAV_DB_USER: pixav_worker
  PIXAV_EXPECTED_REDIS_RUN_ID: ${PIXAV_EXPECTED_REDIS_RUN_ID:-UNBOUND}
  PIXAV_MANAGED_MEDIA_WORKFLOW: "true"
  PIXAV_PIXEL_INJECTOR_MODE: windows_android
  PIXAV_LOCAL_CLEANUP_APPLY: "false"
  PIXAV_UPLOAD_MAX_CONCURRENCY: "1"
  PIXAV_DOWNLOAD_MIN_FREE_BYTES: ${PIXAV_DOWNLOAD_MIN_FREE_BYTES:-107374182400}
  PIXAV_DOWNLOAD_MIN_FREE_PERCENT: ${PIXAV_DOWNLOAD_MIN_FREE_PERCENT:-10}
  PIXAV_STORAGE_WORKER_OWNER: ${PIXAV_STORAGE_WORKER_OWNER:?set the stable runtime owner}
  PIXAV_STORAGE_WINDOWS_RUNTIME_ID: ${PIXAV_STORAGE_WINDOWS_RUNTIME_ID:?set the runtime ID}
  PIXAV_STORAGE_WINDOWS_RUNTIME_GENERATION: ${PIXAV_STORAGE_WINDOWS_RUNTIME_GENERATION:?set the runtime generation}
  PIXAV_STORAGE_STAGING_DIR: ${PIXAV_MANAGED_STAGING_HOST_ROOT:?set the existing daemon-host staging directory}
  PIXAV_STORAGE_READBACK_DIR: /app/data/storage-readback
  PIXAV_PLAYBACK_CACHE_DIR: /app/data/playback-cache
  PIXAV_HOST_PROJECT_ROOT: ${PIXAV_MANAGED_PROJECT_ROOT:-UNBOUND}
  PIXAV_WINDOWS_CONTROL_URL: https://host.docker.internal:5043
  PIXAV_WINDOWS_CONTROL_CA: /run/secrets/windows_ca
  PIXAV_WINDOWS_CONTROL_CERTIFICATE: /run/secrets/windows_certificate
  PIXAV_WINDOWS_CONTROL_KEY: /run/secrets/windows_key
  PIXAV_WINDOWS_CONTROL_DOCKER_DAEMON_ID: ${PIXAV_WINDOWS_CONTROL_DOCKER_DAEMON_ID:-UNBOUND}
  PIXAV_WINDOWS_CONTROL_IDENTITY_SHA256: ${PIXAV_WINDOWS_CONTROL_IDENTITY_SHA256:-UNBOUND}
  PIXAV_WINDOWS_CAPACITY_VOLUME_DEVICE: ${PIXAV_WINDOWS_CAPACITY_VOLUME_DEVICE:-0}
  PIXAV_DOWNLOAD_PAUSE_TOKEN_FILE: /run/secrets/download_pause_token
  PIXAV_STORAGE_READBACK_IMAGE: ${PIXAV_MANAGED_COLD_IMAGE:-UNBOUND}
  PIXAV_PHOTOS_COLD_AUTH_SECRET: /run/photos-auth/cookies.json
x-activity: &activity
  <<: *app
  command: []
  secrets:
    - source: worker_password
      target: /run/secrets/PIXAV_DB_PASSWORD
    - source: redis_client_url
      target: /run/secrets/PIXAV_REDIS_URL
    - windows_ca
    - windows_certificate
    - windows_key
    - download_pause_token
    - source: photos_auth
      target: /run/photos-auth/cookies.json
  group_add: ['${PIXAV_MANAGED_DOCKER_GID:-0}']
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    - /run/photos-auth:rw,nosuid,nodev,noexec,size=1m,mode=0700,uid=${PIXAV_MANAGED_UID:-1000},gid=${PIXAV_MANAGED_GID:-1000}
  networks: [core, runtime]
services:
  gluetun:
    profiles: [vpn, torrent]
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    pull_policy: never
    restart: "no"
    user: "0:0"
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    devices: [/dev/net/tun:/dev/net/tun:rw]
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_CONF_SECRETFILE: /run/secrets/wg0.conf
      FIREWALL_ENABLED_DISABLING_IT_SHOOTS_YOU_IN_YOUR_FOOT: "on"
      FIREWALL_OUTBOUND_SUBNETS: ""
      FIREWALL_INPUT_PORTS: "8080"
      FIREWALL_VPN_INPUT_PORTS: ""
      HEALTH_SMALL_CHECK_TYPE: dns
      HEALTH_TARGET_ADDRESSES: 1.1.1.1:443,1.0.0.1:443
      HEALTH_SERVER_ADDRESS: 127.0.0.1:9999
      HEALTH_RESTART_VPN: "on"
      DNS_KEEP_NAMESERVER: "on"
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8000
      HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH: /run/secrets/vpn_control_auth
      HTTP_CONTROL_SERVER_LOG: "off"
      HTTPPROXY: "off"
      SHADOWSOCKS: "off"
      PUID: "0"
      PGID: "0"
    secrets:
      - source: vpn_wireguard
        target: /run/secrets/wg0.conf
      - vpn_control_auth
    volumes:
      - type: bind
        source: ${PIXAV_MANAGED_VPN_RESOLV_CONF:-.verify/managed-unconfigured/vpn-resolv.conf}
        target: /etc/resolv.conf
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /gluetun:rw,nosuid,nodev,noexec,size=64m,mode=0700
    networks: [runtime, download_control]
    healthcheck:
      test: [CMD, /gluetun-entrypoint, healthcheck]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
  qbittorrent:
    profiles: [torrent]
    image: lscr.io/linuxserver/qbittorrent@sha256:304b19cf94bf4fda534e0b086cab9c5f1a9e139a8180c05c0ad7d2ba1526fa99
    pull_policy: never
    restart: "no"
    user: ${PIXAV_MANAGED_UID:-1000}:${PIXAV_MANAGED_GID:-1000}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [/bin/sh, -c]
    command: ['umask 077; exec /app/qbittorrent-nox --confirm-legal-notice --webui-port=8080']
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    environment:
      <<: *private-transport
      HOME: /config
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /config
      XDG_CACHE_HOME: /tmp
    volumes:
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/qbittorrent
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/downloads
        target: /downloads
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_VPN_RESOLV_CONF:-.verify/managed-unconfigured/vpn-resolv.conf}
        target: /etc/resolv.conf
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    healthcheck:
      test: [CMD, nc, -z, -w, '3', 127.0.0.1, '8080']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  migrate:
    <<: *app
    profiles: [schema]
    entrypoint: [python, -m, scripts.migrate]
    command: [--db-identity, '${PIXAV_EXPECTED_DB_IDENTITY:-UNBOUND}', --database, '${PIXAV_MANAGED_DATABASE:-pixav_managed}']
    environment:
      <<: *db-environment
      PIXAV_DB_USER: ${PIXAV_MANAGED_DB_ADMIN:-pixav_admin}
    secrets:
      - source: postgres_password
        target: /run/secrets/PIXAV_DB_PASSWORD
    networks: [core]
  provision:
    <<: *app
    profiles: [schema]
    entrypoint: [python, -m, scripts.provision_workflow_roles]
    command: [--db-identity, '${PIXAV_EXPECTED_DB_IDENTITY:-UNBOUND}']
    environment:
      <<: *db-environment
      PIXAV_DB_USER: ${PIXAV_MANAGED_DB_ADMIN:-pixav_admin}
      PIXAV_AUTHORITY_ROLE_PASSWORD_FILE: /run/secrets/authority_password
      PIXAV_WORKER_ROLE_PASSWORD_FILE: /run/secrets/worker_password
      PIXAV_READER_ROLE_PASSWORD_FILE: /run/secrets/reader_password
    secrets:
      - source: postgres_password
        target: /run/secrets/PIXAV_DB_PASSWORD
      - authority_password
      - worker_password
      - reader_password
    networks: [core]
  maxwell_core:
    <<: *app
    profiles: [authority]
    entrypoint: [python, -m, pixav.maxwell_core.worker]
    command: []
    environment:
      <<: *db-environment
      PIXAV_DB_USER: pixav_authority
      PIXAV_EXPECTED_REDIS_RUN_ID: ${PIXAV_EXPECTED_REDIS_RUN_ID:-UNBOUND}
      PIXAV_MANAGED_MEDIA_WORKFLOW: "true"
      PIXAV_PIXEL_INJECTOR_MODE: windows_android
      PIXAV_LOCAL_CLEANUP_APPLY: "false"
      PIXAV_UPLOAD_MAX_CONCURRENCY: "1"
      PIXAV_DOWNLOAD_DIR: /app/data/downloads
      PIXAV_DOWNLOAD_MIN_FREE_BYTES: ${PIXAV_DOWNLOAD_MIN_FREE_BYTES:-107374182400}
      PIXAV_DOWNLOAD_MIN_FREE_PERCENT: ${PIXAV_DOWNLOAD_MIN_FREE_PERCENT:-10}
      PIXAV_REMUX_DIR: /app/data/remuxed
      PIXAV_LIBRARY_ROOT: /app/data/library
      PIXAV_RESOLVER_BASE_URL: http://playback-gateway:8080
      PIXAV_ARTWORK_ROOT: /app/data/artwork
      PIXAV_PLAYBACK_CACHE_DIR: /app/data/playback-cache
      PIXAV_STORAGE_WORKER_OWNER: ${PIXAV_STORAGE_WORKER_OWNER:?set the stable runtime owner}
      PIXAV_STORAGE_WINDOWS_RUNTIME_ID: ${PIXAV_STORAGE_WINDOWS_RUNTIME_ID:?set the runtime ID}
      PIXAV_STORAGE_WINDOWS_RUNTIME_GENERATION: ${PIXAV_STORAGE_WINDOWS_RUNTIME_GENERATION:?set the runtime generation}
      PIXAV_WINDOWS_CONTROL_URL: https://host.docker.internal:5043
      PIXAV_WINDOWS_CONTROL_CA: /run/secrets/windows_ca
      PIXAV_WINDOWS_CONTROL_CERTIFICATE: /run/secrets/windows_certificate
      PIXAV_WINDOWS_CONTROL_KEY: /run/secrets/windows_key
      PIXAV_WINDOWS_CONTROL_DOCKER_DAEMON_ID: ${PIXAV_WINDOWS_CONTROL_DOCKER_DAEMON_ID:-UNBOUND}
      PIXAV_WINDOWS_CONTROL_IDENTITY_SHA256: ${PIXAV_WINDOWS_CONTROL_IDENTITY_SHA256:-UNBOUND}
      PIXAV_WINDOWS_CAPACITY_VOLUME_DEVICE: ${PIXAV_WINDOWS_CAPACITY_VOLUME_DEVICE:-0}
      PIXAV_DOWNLOAD_PAUSE_TOKEN_FILE: /run/secrets/download_pause_token
      PIXAV_STORAGE_READBACK_IMAGE: ${PIXAV_MANAGED_COLD_IMAGE:-UNBOUND}
    secrets:
      - source: authority_password
        target: /run/secrets/PIXAV_DB_PASSWORD
      - source: redis_client_url
        target: /run/secrets/PIXAV_REDIS_URL
      - windows_ca
      - windows_certificate
      - windows_key
      - download_pause_token
    group_add: ['${PIXAV_MANAGED_DOCKER_GID:-0}']
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/downloads
        target: /app/data/downloads
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/remuxed
        target: /app/data/remuxed
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/library
        target: /app/data/library
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/artwork
        target: /app/data/artwork
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/playback-cache
        target: /app/data/playback-cache
        bind: {create_host_path: false}
    networks: [core, runtime]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=3)']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
  storage_worker:
    <<: *activity
    profiles: [storage]
    entrypoint: [python, -m, pixav.pixel_injector.storage_worker]
    environment:
      <<: *activity-environment
      PIXAV_DOWNLOAD_DIR: /app/data/storage-readback
      PIXAV_REMUX_DIR: /app/data/remuxed
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/remuxed
        target: /app/data/remuxed
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/storage-readback
        target: /app/data/storage-readback
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_STAGING_HOST_ROOT:?set the existing daemon-host staging directory}
        target: ${PIXAV_MANAGED_STAGING_HOST_ROOT:?set the existing daemon-host staging directory}
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8005/health", timeout=3)']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
  playback_worker:
    <<: *activity
    profiles: [playback]
    entrypoint: [python, -m, pixav.pixel_injector.playback_worker]
    environment:
      <<: *activity-environment
      PIXAV_DOWNLOAD_DIR: /app/data/playback-cache
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/storage-readback
        target: /app/data/storage-readback
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/playback-cache
        target: /app/data/playback-cache
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8007/health", timeout=3)']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
  media_loader:
    <<: *app
    profiles: [media]
    entrypoint: [python, -m, pixav.media_loader.worker]
    command: []
    environment:
      <<: [*db-environment, *private-transport]
      PIXAV_DB_USER: pixav_worker
      PIXAV_EXPECTED_REDIS_RUN_ID: ${PIXAV_EXPECTED_REDIS_RUN_ID:-UNBOUND}
      PIXAV_MANAGED_MEDIA_WORKFLOW: "true"
      PIXAV_PIXEL_INJECTOR_MODE: windows_android
      PIXAV_LOCAL_CLEANUP_APPLY: "false"
      PIXAV_UPLOAD_MAX_CONCURRENCY: "1"
      PIXAV_DOWNLOAD_DIR: /app/data/downloads
      PIXAV_REMUX_DIR: /app/data/remuxed
      PIXAV_DOWNLOAD_MIN_FREE_BYTES: ${PIXAV_DOWNLOAD_MIN_FREE_BYTES:-107374182400}
      PIXAV_DOWNLOAD_MIN_FREE_PERCENT: ${PIXAV_DOWNLOAD_MIN_FREE_PERCENT:-10}
      PIXAV_QBIT_URL: http://gluetun:8080
      PIXAV_QBIT_USER: pixav
      PIXAV_QBIT_DOWNLOAD_DIR: /downloads
      PIXAV_STASH_ENABLED: "false"
      PIXAV_STORAGE_WORKER_OWNER: ${PIXAV_STORAGE_WORKER_OWNER:?set the stable runtime owner}
      PIXAV_STORAGE_WINDOWS_RUNTIME_ID: ${PIXAV_STORAGE_WINDOWS_RUNTIME_ID:?set the runtime ID}
      PIXAV_STORAGE_WINDOWS_RUNTIME_GENERATION: ${PIXAV_STORAGE_WINDOWS_RUNTIME_GENERATION:?set the runtime generation}
      PIXAV_WINDOWS_CONTROL_URL: https://host.docker.internal:5043
      PIXAV_WINDOWS_CONTROL_CA: /run/secrets/windows_ca
      PIXAV_WINDOWS_CONTROL_CERTIFICATE: /run/secrets/windows_certificate
      PIXAV_WINDOWS_CONTROL_KEY: /run/secrets/windows_key
      PIXAV_WINDOWS_CONTROL_DOCKER_DAEMON_ID: ${PIXAV_WINDOWS_CONTROL_DOCKER_DAEMON_ID:-UNBOUND}
      PIXAV_WINDOWS_CONTROL_IDENTITY_SHA256: ${PIXAV_WINDOWS_CONTROL_IDENTITY_SHA256:-UNBOUND}
      PIXAV_WINDOWS_CAPACITY_VOLUME_DEVICE: ${PIXAV_WINDOWS_CAPACITY_VOLUME_DEVICE:-0}
      PIXAV_DOWNLOAD_PAUSE_TOKEN_FILE: /run/secrets/download_pause_token
    secrets:
      - source: worker_password
        target: /run/secrets/PIXAV_DB_PASSWORD
      - source: redis_client_url
        target: /run/secrets/PIXAV_REDIS_URL
      - source: qbit_password
        target: /run/secrets/PIXAV_QBIT_PASSWORD
      - windows_ca
      - windows_certificate
      - windows_key
      - download_pause_token
    volumes:
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/downloads
        target: /app/data/downloads
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/remuxed
        target: /app/data/remuxed
        bind: {create_host_path: false}
    networks: [core, runtime, download_control]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8002/health", timeout=3)']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 45s
  strm_resolver:
    <<: *app
    profiles: [resolver]
    entrypoint: [python, -m, uvicorn]
    command: [pixav.strm_resolver.app:create_app, --factory, --host, 0.0.0.0, --port, '8000', --no-access-log]
    environment:
      <<: [*db-environment, *private-transport]
      PIXAV_DB_USER: pixav_reader
      PIXAV_EXPECTED_REDIS_RUN_ID: ${PIXAV_EXPECTED_REDIS_RUN_ID:-UNBOUND}
      PIXAV_MANAGED_MEDIA_WORKFLOW: "true"
      PIXAV_PIXEL_INJECTOR_MODE: windows_android
      PIXAV_RESOLVER_REQUIRE_READER_ROLE: "true"
      PIXAV_RESOLVER_AUTH_REQUIRED: "true"
      PIXAV_RESOLVER_TOKEN_FILE: /run/playback-auth/resolver_token
      PIXAV_RESOLVER_RATE_LIMIT_RPM: "6000"
      PIXAV_PLAYBACK_CACHE_DIR: /app/data/playback-cache
    secrets:
      - source: reader_password
        target: /run/secrets/PIXAV_DB_PASSWORD
      - source: redis_client_url
        target: /run/secrets/PIXAV_REDIS_URL
    volumes:
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/playback-cache
        target: /app/data/playback-cache
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_PLAYBACK_AUTH_DIR:-.verify/managed-unconfigured/playback-auth}
        target: /run/playback-auth
        read_only: true
        bind: {create_host_path: false}
    networks: [core, playback_backend]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)']
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
  playback-gateway:
    <<: *gateway
    profiles: [library]
    entrypoint: [/usr/local/bin/pixav-playback-gateway]
    command: []
    environment:
      <<: *private-transport
      PIXAV_RESOLVER_TOKEN_FILE: /run/playback-auth/resolver_token
    volumes:
      - type: bind
        source: ${PIXAV_MANAGED_PLAYBACK_AUTH_DIR:-.verify/managed-unconfigured/playback-auth}
        target: /run/playback-auth
        read_only: true
        bind: {create_host_path: false}
    networks: [playback_backend, library_media]
    healthcheck:
      test: [CMD, wget, -q, -T, '3', -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  jellyfin:
    profiles: [library]
    image: jellyfin/jellyfin:12.1@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
    pull_policy: never
    restart: "no"
    user: ${PIXAV_MANAGED_UID:-1000}:${PIXAV_MANAGED_GID:-1000}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    environment: *private-transport
    volumes:
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/jellyfin/config
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/jellyfin/cache
        target: /cache
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/library
        target: /media/library
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${PIXAV_MANAGED_JELLYFIN_LOGGING_POLICY:-./config/jellyfin/logging.json}
        target: /config/config/logging.json
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    networks:
      library_media: {}
      library_origin:
        aliases: [jellyfin-origin]
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, '3', http://127.0.0.1:8096/health]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 60s
  jellyfin-client-gateway:
    <<: *gateway
    profiles: [library]
    entrypoint: [/usr/local/bin/pixav-jellyfin-gateway]
    command: []
    environment: *private-transport
    ports:
      - target: 8096
        published: ${PIXAV_MANAGED_JELLYFIN_PORT:-18096}
        host_ip: 127.0.0.1
        protocol: tcp
    networks: [library_origin, client_capture, library_ingress]
    healthcheck:
      test: [CMD, wget, -q, -T, '3', -O, /dev/null, http://127.0.0.1:8096/health]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 30s
  windows_tools:
    profiles: [windows-tools]
    image: ${PIXAV_MANAGED_WINDOWS_TOOLS_IMAGE:?set the immutable tools image ID}
    pull_policy: never
    command: [sleep, infinity]
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    environment:
      ADB_SERVER_SOCKET: tcp:host.docker.internal:5037
      PIXAV_ANDROID_ADB_SERVER_HOST: host.docker.internal
      ANDROID_SERIAL: ${PIXAV_ANDROID_SERIAL:?set the exact registered Windows serial}
      MAESTRO_CLI_NO_ANALYTICS: "1"
    volumes:
      - type: bind
        source: ${PIXAV_MANAGED_STAGING_HOST_ROOT:?set the existing daemon-host staging directory}
        target: /parts
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
      - /root:rw,nosuid,nodev,size=512m,mode=0700
      - /work:rw,nosuid,nodev,size=512m,mode=0700
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(timeout --kill-after=2s 10s adb -s "$$ANDROID_SERIAL" get-state 2>/dev/null | tr -d '\r\n')" = device
          && test "$$(timeout --kill-after=2s 10s adb -s "$$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n')" = 1
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 240s
    labels:
      pixav.photos_canary.owner: ${PIXAV_STORAGE_WORKER_OWNER:?set the stable runtime owner}
      pixav.photos_canary.role: tools
      pixav.runtime.id: ${PIXAV_STORAGE_WINDOWS_RUNTIME_ID:?set the registered runtime ID}
      pixav.runtime.generation: ${PIXAV_STORAGE_WINDOWS_RUNTIME_GENERATION:?set the registered generation}
  postgres:
    profiles: [core]
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    pull_policy: never
    restart: "no"
    user: ${PIXAV_MANAGED_UID:-1000}:${PIXAV_MANAGED_GID:-1000}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2.0
    mem_limit: 3g
    memswap_limit: 3g
    pids_limit: 256
    shm_size: 256m
    environment:
      POSTGRES_USER: ${PIXAV_MANAGED_DB_ADMIN:-pixav_admin}
      POSTGRES_DB: ${PIXAV_MANAGED_DATABASE:-pixav_managed}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
    command: [postgres, -c, max_wal_size=128MB, -c, min_wal_size=32MB, -c, log_min_error_statement=panic]
    volumes:
      - type: bind
        source: ${PIXAV_MANAGED_POSTGRES_HOST_ROOT:-${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/postgres}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    secrets: [postgres_password]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,nosuid,nodev,size=16m,mode=3775,uid=${PIXAV_MANAGED_UID:-1000},gid=${PIXAV_MANAGED_GID:-1000}
    networks: [core]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 60s
  redis:
    profiles: [core]
    image: redis:8.2-alpine@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    pull_policy: never
    restart: "no"
    user: ${PIXAV_MANAGED_UID:-1000}:${PIXAV_MANAGED_GID:-1000}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    command: [redis-server, /run/secrets/redis_config, --dir, /data, --appendonly, "yes", --appendfsync, everysec, --bind, 0.0.0.0, --protected-mode, "yes"]
    volumes:
      - type: bind
        source: ${PIXAV_MANAGED_DATA_ROOT:-.verify/managed-unconfigured}/redis
        target: /data
        bind:
          create_host_path: false
    secrets: [redis_config, redis_password]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    networks: [core]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli --no-auth-warning ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
networks:
  core:
    internal: true
  runtime: {}
  download_control:
    internal: true
  playback_backend:
    internal: true
  library_media:
    internal: true
  library_origin:
    internal: true
  client_capture:
    internal: true
  library_ingress: {}
secrets:
  postgres_password:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/postgres_password
  redis_config:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/redis_config
  redis_password:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/redis_password
  authority_password:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/authority_password
  worker_password:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/worker_password
  reader_password:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/reader_password
  redis_client_url:
    file: ${PIXAV_MANAGED_REDIS_CLIENT_URL_FILE:-${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/redis_client_url}
  qbit_password:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/qbit_password
  windows_ca:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/windows_ca
  windows_certificate:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/windows_certificate
  windows_key:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/windows_key
  download_pause_token:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/download_pause_token
  photos_auth:
    file: ${PIXAV_MANAGED_PHOTOS_AUTH_SECRET:-.verify/managed-unconfigured/photos-auth.json}
  vpn_wireguard:
    file: ${PIXAV_MANAGED_WIREGUARD_CONFIG:-.verify/managed-unconfigured/wg0.conf}
  vpn_control_auth:
    file: ${PIXAV_MANAGED_SECRETS_ROOT:-.verify/managed-unconfigured}/vpn_control_auth
