# Jellyfin owns client authentication; nginx checks it for every protected request.
# No auth cache: revoked device tokens must fail on the next media request.
map $http_upgrade $pixav_jellyfin_connection {
    default upgrade;
    '' close;
}
map $request_uri $pixav_jellyfin_query_token {
    default "";
    ~*[?&]api_?key=(?<pixav_jellyfin_url_token>[^&]*) $pixav_jellyfin_url_token;
}
map $pixav_jellyfin_query_token $pixav_jellyfin_query_or_cookie {
    default $pixav_jellyfin_query_token;
    '' $cookie_pixav_jellyfin_client;
}
map $http_x_emby_token $pixav_jellyfin_request_token {
    default $http_x_emby_token;
    '' $pixav_jellyfin_query_or_cookie;
}
map $http_x_emby_authorization $pixav_jellyfin_legacy_authorization {
    default $http_x_emby_authorization;
    '' 'MediaBrowser Token="$pixav_jellyfin_request_token"';
}
map $http_authorization $pixav_jellyfin_authorization {
    default $http_authorization;
    '' $pixav_jellyfin_legacy_authorization;
}
map $pixav_jellyfin_authorization $pixav_jellyfin_client_cookie {
    default "";
    ~*Token=\"(?<pixav_jellyfin_header_token>[A-Za-z0-9_-]+)\" "pixav_jellyfin_client=$pixav_jellyfin_header_token; Path=/; HttpOnly; SameSite=Strict";
}

server {
    listen 8096;
    access_log off;
    # Request URIs can contain Jellyfin's own client tokens.
    error_log /dev/null;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $pixav_jellyfin_origin jellyfin-origin:8096;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $pixav_jellyfin_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $pixav_jellyfin_connection;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /_pixav_jellyfin_auth {
        internal;
        proxy_pass http://$pixav_jellyfin_origin/Users/Me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $pixav_jellyfin_authorization;
        proxy_set_header X-Emby-Authorization $http_x_emby_authorization;
        proxy_set_header X-Emby-Token $pixav_jellyfin_request_token;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    # Fixed public bootstrap routes support the ordinary Jellyfin Web login.
    location = / { proxy_pass http://$pixav_jellyfin_origin; }
    location = /web { proxy_pass http://$pixav_jellyfin_origin; }
    location /web/ { proxy_pass http://$pixav_jellyfin_origin; }
    # Jellyfin Web uses several spellings; match only these complete routes.
    location ~* ^/(health|System/Info/Public|System/Ping|Users/Public|Users/AuthenticateByName|Auth/Providers|QuickConnect/Enabled|Branding/Configuration|Branding/Css)$ {
        proxy_pass http://$pixav_jellyfin_origin;
    }

    location / {
        auth_request /_pixav_jellyfin_auth;
        # Web's image requests omit native headers. Reuse the same device token
        # after successful native authentication, and validate it on every use.
        # This listener is loopback/internal HTTP; public deployment requires TLS.
        add_header Set-Cookie $pixav_jellyfin_client_cookie;
        proxy_pass http://$pixav_jellyfin_origin;
    }
}
