# Calibrated password page with keyboard open, 720x1280, 2026-09-08.
# Cleared first for the same reason as email.yaml.
appId: com.google.android.gms
---
- assertVisible: "Show password"
- tapOn:
    point: "50%,27%"
- eraseText: 120
- inputText:
    text: ${MAESTRO_PASSWORD}
    label: "Enter canary password privately"
- hideKeyboard
- tapOn: "NEXT"
