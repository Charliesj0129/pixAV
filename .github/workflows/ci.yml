name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Ensure optional heavyweight groups are never pulled in by default.
      UV_NO_GROUP: embeddings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        # Avoid installing optional heavyweight groups (e.g. embeddings -> torch) in CI.
        run: uv sync --frozen --no-group embeddings

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Black
        run: uv run black --check src tests scripts

      - name: Isort
        run: uv run isort --check-only src tests scripts

      - name: Mypy
        run: uv run mypy src

      - name: Bind integration identities to job-owned services
        run: |
          set -euo pipefail
          docker context show
          docker info --format '{{.ID}}'
          docker compose -f docker-compose.integration.yml up -d --wait postgres
          postgres_container=$(docker compose -f docker-compose.integration.yml ps -q postgres)
          echo "POSTGRES_CONTAINER=$postgres_container" >> "$GITHUB_ENV"
          docker compose -f docker-compose.integration.yml up -d --wait redis
          redis_container=$(docker compose -f docker-compose.integration.yml ps -q redis)
          echo "REDIS_CONTAINER=$redis_container" >> "$GITHUB_ENV"
          docker inspect --format '{{.Id}} {{.Config.Image}} {{json .NetworkSettings.Ports}}' "$postgres_container" "$redis_container"
          db_identity=$(docker exec "$postgres_container" psql -U pixav_test -d pixav_integration -Atc 'SELECT system_identifier FROM pg_control_system()')
          redis_identity=$(docker exec "$redis_container" redis-cli --raw INFO server | sed -n 's/^run_id://p' | tr -d '\r')
          test -n "$db_identity"
          test -n "$redis_identity"
          echo "PIXAV_TEST_DB_IDENTITY=$db_identity" >> "$GITHUB_ENV"
          echo "PIXAV_TEST_REDIS_IDENTITY=$redis_identity" >> "$GITHUB_ENV"

      - name: Pytest with guarded PostgreSQL and Redis integration
        env:
          PIXAV_RUN_INTEGRATION: "1"
          PIXAV_E2E_ADMIN_DSN: postgresql://pixav_test:integration-only@127.0.0.1:15432/pixav_integration
          PIXAV_E2E_REDIS_URL: redis://127.0.0.1:16379/0
        run: uv run pytest -q --cov=src/pixav --cov-report=term-missing --cov-report=xml

      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

      - name: Remove job-owned integration containers
        if: always()
        run: |
          if [ -n "${REDIS_CONTAINER:-}" ]; then docker rm -f "$REDIS_CONTAINER"; fi
          if [ -n "${POSTGRES_CONTAINER:-}" ]; then docker rm -f "$POSTGRES_CONTAINER"; fi
