name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation scope (synthetic external boundaries, no live Photos/Jellyfin)
        type: choice
        options:
          - full
          - short-core
        default: full

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Ensure optional heavyweight groups are never pulled in by default.
      UV_NO_GROUP: embeddings
      PIXAV_E2E_ADMIN_DSN: postgresql://pixav_test:integration-only@127.0.0.1:15432/pixav_integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        # Avoid installing optional heavyweight groups (e.g. embeddings -> torch) in CI.
        run: uv sync --frozen --no-group embeddings

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Black
        run: uv run black --check src tests scripts

      - name: Isort
        run: uv run isort --check-only src tests scripts

      - name: Mypy
        run: uv run mypy src

      - name: Validate deployment configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env.example -f docker-compose.yml config --quiet
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Start isolated contract databases
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          docker compose -f docker-compose.integration.yml up -d --wait

      - name: Verify and bind disposable instance identities
        run: |
          uv run python - <<'PY'
          import asyncio, os
          import asyncpg
          import redis.asyncio as redis
          async def main():
              db = await asyncpg.connect('postgresql://pixav_test:integration-only@127.0.0.1:15432/pixav_integration')
              cache = redis.from_url('redis://127.0.0.1:16379/0')
              try:
                  assert await db.fetchval('SELECT current_database()') == 'pixav_integration'
                  identity = await db.fetchval('SELECT system_identifier FROM pg_control_system()')
                  run_id = (await cache.info('server'))['run_id']
                  with open(os.environ['GITHUB_ENV'], 'a') as target:
                      target.write(f'PIXAV_RUN_INTEGRATION=1\nPIXAV_TEST_DB_IDENTITY={identity}\nPIXAV_TEST_REDIS_IDENTITY={run_id}\n')
              finally:
                  await db.close()
                  await cache.aclose()
          asyncio.run(main())
          PY

      - name: Short synthetic core journey
        timeout-minutes: 3
        run: uv run pytest -q tests/integration/test_short_journey.py --junitxml=short-core.xml

      - name: Short journey scope and result
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Short synthetic core journey
          See the `Short synthetic core journey` step and JUnit artifact for its result.

          One video: source policy -> Redis/media worker -> FFmpeg remux -> upload/verification domain transitions -> DURABLE -> READY -> STRM/NFO/poster -> TCP GET/HEAD/Range -> remove synthetic staging/cache -> recover -> revoke device -> withdraw invalid publication.

          Real: PostgreSQL, Redis, FFmpeg, domain services, HTTP server and file transport.
          Fixtures: torrent acquisition, Photos upload and independent read-back bytes, sufficient disk for the tiny clip.
          Not covered: real Pixel/Photos, Jellyfin scan/client playback, production cleanup eligibility, multi-part boundaries, 24-hour quota, production backup/restore.
          No Google credentials or persistent test host are used. Only disposable integration instances are removed.
          EOF

      - name: Save synthetic journey result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-core-result
          path: short-core.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Pytest
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'short-core'
        run: uv run pytest -q --cov=src/pixav --cov-report=term-missing --cov-fail-under=80

      - name: Remove disposable contract instances
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v
