global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname, severity, module, stage, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 6h
  routes:
    - receiver: telegram
      matchers: ['severity="critical"']
      repeat_interval: 1h
    - receiver: telegram
      matchers: ['severity="warning"']
      repeat_interval: 6h
    - receiver: telegram
      matchers: ['severity="heartbeat"']
      group_wait: 0s
      repeat_interval: 24h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: |-
          [{{ .Status | toUpper }}] pixAV {{ .GroupLabels.alertname }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [alertname, instance]
