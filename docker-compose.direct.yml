# Explicit opt-in direct networking; traffic does not use the VPN tunnel.
# Production: base + prod + direct. VPN production: base + prod.
# Stop the previous mode explicitly before switching; profiles do not stop existing containers.
services:
  gluetun:
    profiles: [vpn]
  vpn_sentinel:
    profiles: [vpn]
  qbittorrent:
    network_mode: !reset null
    depends_on: !reset {}
    networks:
      - pixav
    ports:
      - "${PIXAV_QBIT_PORT:-8085}:${PIXAV_QBIT_PORT:-8085}"
      - "6881:6881"
      - "6881:6881/udp"
  media_loader:
    environment:
      PIXAV_QBIT_URL: http://qbittorrent:${PIXAV_QBIT_PORT:-8085}
      # No VPN report is expected in direct mode, including stale Redis reports.
      PIXAV_VPN_EGRESS_ECHO_URL: ""
